# ==============================================================================
# MediaTidy 自定义规则（custom_rules）—— 识别增强
# ==============================================================================
#
# 【这个文件干什么的】
#   MediaTidy 的识别链路是：
#     mr 渲染词（清洗文件名） → 文件名解析 → TMDB 匹配 → mp 季集映射
#     → 命名模板 → output_mr（输出后处理）
#
#   本文件只负责两件事：
#     1. 用 mr 把「烂文件名」洗成「能被正常解析的文件名」→ 减少「识别不到」
#     2. 用 mp 修正 TMDB 与文件不一致的季集号 → 减少「季集错乱」
#
#   ⚠ tmdb_override / tmdb_blacklist 需要具体 TMDB ID，属一次性个案，
#     放在文件末尾以注释形式给出模板，用到时再打开填写。
#
# ------------------------------------------------------------------------------
# 【语法要点（官方文档）】
#   · 正则默认不区分大小写；替换里用 $1 $2 引用捕获组
#   · mr 按定义顺序依次执行，靠前的先生效
#   · 多个 mr 规则叠加时，前一条的输出就是后一条的输入
#   · action: remove 表示整段删除；用 replace 时不要漏写，否则该条不生效
#
# ------------------------------------------------------------------------------
# 【使用方式】
#   1. 「规则引擎 → 自定义规则」页面，把本文件内容粘贴进去（或分段取用）。
#   2. 先只启用 mr 的前 3 条跑一批文件，看识别率变化，再逐条加。
#   3. mp 的 ID 必须换成你实际的 TMDB ID，示例里的数字是占位符。
#
# ------------------------------------------------------------------------------
# 【三条铁律 —— 写 mr 之前必读】
#   1. **不要删年份、分辨率、季集号、[tmdbid-xxx] / {tmdb-xxx}**
#      这些是识别的命根子。本文件的正则都刻意避开了它们。
#   2. **正则宁可窄，不要宽**
#      一条 `\[.*\]` 会把 `[tmdbid-902533]` 一起删掉，导致 100% 识别失败。
#      删除类规则一定要带「特征词」限定（www. / .com / @ / 字幕组 等）。
#   3. **一次只改一类问题**
#      同时加 5 条规则后识别率掉了，你分不清是哪条闯的祸。
# ==============================================================================

# ==============================================================================
# 一、mr 渲染词 —— 识别前清洗文件名
# ==============================================================================
mr:

  # ----------------------------------------------------------------------------
  # 1. 删除带网址/邮箱特征的方括号广告
  #    只删「方括号内出现 www. / http / .com / @ 」的段，普通方括号不动。
  #    [tmdbid-902533] 之类不含这些特征，安全。
  # ----------------------------------------------------------------------------
  - name: 删除方括号站标广告
    pattern: "\\[(?=[^\\]]*(?:www\\.|https?:|\\.com|\\.net|\\.org|@))[^\\]]*\\]"
    action: remove

  # ----------------------------------------------------------------------------
  # 2. 删除带站标特征的无括号广告串
  #    形如 xxx.com 出现在文件名里（常紧跟在一串字母后面）
  # ----------------------------------------------------------------------------
  - name: 删除裸网址
    pattern: "(?<![a-z0-9])(?:www\\.)?[a-z0-9-]{2,30}\\.(?:com|net|org|cc|top|xyz)(?![a-z])"
    action: remove

  # ----------------------------------------------------------------------------
  # 3. 中文集数 → 标准 SxxExx 用的 E 标记
  #    「第12集 / 第12话 / 第12話 / 第12期」→ E12
  #    注意：只处理 1~3 位数字，避免误伤「第 2 季」这类
  # ----------------------------------------------------------------------------
  - name: 中文集数转E
    pattern: "第(\\d{1,3})[集话話期]"
    replace: "E$1"

  # ----------------------------------------------------------------------------
  # 4. 中文季号 → Season 标记
  #    「第2季」→ Season 2 ；放在第 3 条之后执行，避免「第2季第3集」被拆错
  # ----------------------------------------------------------------------------
  - name: 中文季号转Season
    pattern: "第(\\d{1,2})季"
    replace: "Season $1"

  # ----------------------------------------------------------------------------
  # 5. 全季包 → 季集范围
  #    「全24集」→ S01E01-E24（首季全集包）；不含季号时才生效
  # ----------------------------------------------------------------------------
  - name: 全季包转范围
    pattern: "全(\\d{1,3})集"
    replace: "S01E01-E$1"

  # ----------------------------------------------------------------------------
  # 6. 竖线分隔符 → 点号
  #    「片名｜2024｜1080p」这类竖线分隔，解析器不认，换成点号
  # ----------------------------------------------------------------------------
  - name: 竖线转点
    pattern: "\\s*[|｜]\\s*"
    replace: "."

  # ----------------------------------------------------------------------------
  # 7. 下划线转点号（仅下划线，不动空格和横杠）
  #    「Movie_Name_2024」→「Movie.Name.2024」
  # ----------------------------------------------------------------------------
  - name: 下划线转点
    pattern: "_"
    replace: "."

  # ----------------------------------------------------------------------------
  # 8. 合并连续点号/空格（清洗过程会造出 .. 或双空格）
  # ----------------------------------------------------------------------------
  - name: 合并连续点号
    pattern: "\\.{2,}"
    replace: "."
  - name: 合并连续空格
    pattern: "\\s{2,}"
    replace: " "

# ==============================================================================
# 二、output_mr —— 命名结果的后处理（作用在最终文件名上）
# ==============================================================================
# ⚠ 这段是「命名规则」的搭档：命名模板本身没有条件分支、去重、判空能力，
#   想省略重复字段只能靠这里的正则。
# ==============================================================================
output_mr:
  # 合并连续空格（属性缺失时可能留出空位）
  - pattern: "\\s{2,}"
    replace: " "
  # 合并连续点号（缺字段时的兜底，正常应该由系统自动合并）
  - pattern: "\\.{2,}"
    replace: "."
  # 去掉扩展名前的多余点号
  - pattern: "\\.\\.(mkv|mp4|ts|iso)$"
    replace: ".$1"

  # ---------------------------------------------------------------------------
  # 清理开头的多余点号
  #    {{title}} 完全取不到值时，文件名会变成「.2004.S01E01.…」
  #    系统只保证合并中间的连续点号，开头的点号要自己清。
  # ---------------------------------------------------------------------------
  - name: 清理开头的多余点号
    pattern: "^\\.+"
    replace: ""

  # ---------------------------------------------------------------------------
  # 去掉连续重复的字段
  #    命名模板是 {{title}}.{{originalTitle}}.…，当一部片没有中文标题时，
  #    {{title}} 会回退成原名，于是出现：
  #      Scene of Crime.Scene of Crime.2004.S01E01.1080p.mkv
  #    「([^.]+)\.\1」匹配「同一段文字紧跟自己」，替换成一份：
  #      Scene of Crime.2004.S01E01.1080p.mkv
  #    用 (?=\.|$) 收尾，只在「后面还跟着点号」或「位于末尾」时才替换，
  #    不会误伤正常的相邻字段（如 A.B.A.C 这种不重复的情况保持原样）。
  #    放在最后执行：前面的空格/点号已清理干净，去重更准确。
  #    边界：每条规则只替换一轮，「A.A.A.A」会变成「A.A」而不是「A」。
  #    实际不会出现（需要 4 个字段完全相同），且真实的重复只有
  #    「{{title}} 与 {{originalTitle}}」这一处。
  # ---------------------------------------------------------------------------
  - name: 去掉连续重复的字段
    pattern: "([^.]+)\\.\\1(?=\\.|$)"
    replace: "$1"

# ==============================================================================
# 三、mp 季集映射 —— 修正 TMDB 与实际文件的季集差异
# ==============================================================================
# ⚠ 下面全部是「注释状态」的模板，需要你换成实际 TMDB ID 再启用。
#   改完记得把每行开头的 "# " 去掉。
#
# mp:
#   # 模板 A：文件按单季连续编号，TMDB 记成多季（特摄 / 长篇动画常见）
#   #   文件 S01E25~E48 → 归到 TMDB 的 S02E01~E24
#   - tmdb: 12345
#     from: { season: 1, ep: [25, 48] }
#     to:   { season: 2, ep: [1, 24] }
#
#   # 模板 B：全集包按 24 集一季拆分
#   - tmdb: 67890
#     from: { season: 1, ep: [1, 24] }
#     to:   { season: 1, ep: [1, 24] }
#   - tmdb: 67890
#     from: { season: 1, ep: [25, 48] }
#     to:   { season: 2, ep: [1, 24] }
#
#   # 模板 C：整体偏移（文件比 TMDB 少一集片头/特典）
#   - tmdb: 11111
#     from: { season: 1, ep: [1, 12] }
#     to:   { season: 1, ep: [2, 13] }
#
#   # 表达式三种写法：
#   #   EP-24   固定偏移（集号减 24）
#   #   EP+1    固定偏移（集号加 1）
#   #   EP      原样保持，只改季号
#   #   范围    直接写目标起止集

# ==============================================================================
# 四、制作组 / 流媒体 标签识别（影响命名里的 {{releaseGroup}} / {{streamingService}}）
# ==============================================================================
# 内置已能识别常见标签。如果命名结果里 releaseGroup 或 streamingService 是空的，
# 再按下面格式补；重复不影响，边界字符会做匹配校验。
#
# groups:
#   - name: "FRDS"
#     keywords: ["FRDS", "Frds"]
#   - name: "WiKi"
#     keywords: ["WiKi", "WIKI"]
#   - name: "CHD"
#     keywords: ["CHD", "CHDBits"]
#   - name: "CMCT"
#     keywords: ["CMCT"]
#   - name: "HDSky"
#     keywords: ["HDSky", "HDS"]
#
# streaming:
#   - name: "Netflix"
#     keywords: ["Netflix", "NF", "NFLX"]
#   - name: "Disney+"
#     keywords: ["DSNP", "Disney+", "DisneyPlus"]
#   - name: "Amazon"
#     keywords: ["AMZN", "Amazon"]
#   - name: "Apple TV+"
#     keywords: ["ATVP", "AppleTV"]
#   - name: "HBO Max"
#     keywords: ["HMAX", "HBOMax", "HBO Max"]

# ==============================================================================
# 五、TMDB 覆盖 / 黑名单 —— 个案修正，按需启用
# ==============================================================================
# 【黑名单：识别到了错误的条目时用】
#   · 匹配键是 tmdb_id + media_type，电影和剧集是独立命名空间，要屏蔽两个得写两条
#   · 被屏蔽的候选会在「同年份唯一性判断 / 评分 / TV 校验 / AI 候选交接」之前过滤，
#     不会阻塞其他可信候选
#   · 屏蔽后若没有其他候选 → 结果是「未识别 + tmdb_blacklisted 诊断」，属预期行为
#   · 不影响手动识别，手动整理仍可用被屏蔽的 ID
#
# tmdb_blacklist:
#   - tmdb_id: 67890
#     media_type: movie
#   - tmdb_id: 67890
#     media_type: tv
#
# 【覆盖：TMDB 元数据本身错了时用】
#   最实用的场景是修正 origin_country —— 它直接决定文件进哪个分类目录，
#   比改分类规则更精准（只影响这一部片）。
#
# tmdb_override:
#   - tmdb_id: 12345
#     media_type: movie
#     title: "正确的中文名"
#     origin_country: ["CN"]

# ==============================================================================
# 【本文件管不到、但同样重要的两件事】
#   1. **未识别目录**：在整理方案「基本设置」里配 unrecognizedDir。
#      不配的话，识别失败的文件会留在原处，且方案记录会报配置错误。
#   2. **文件名里带 TMDB ID 是最高优先级**。
#      命名规则输出的 [tmdbid-xxx] / 现有的 {tmdb-xxx} 会被直接采信，
#      凡是整理过一次的文件，后续再识别都不会出错 —— 误判风险只集中在首次入库。
# ==============================================================================
