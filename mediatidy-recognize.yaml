# ==============================================================================
# MediaTidy 自定义规则（custom_rules）—— 识别增强
# ==============================================================================
#
# 【这个文件干什么的】
#   MediaTidy 的识别链路是：
#     mr 渲染词（清洗文件名） → 文件名解析 → TMDB 匹配 → mp 季集映射
#     → 命名模板 → output_mr（输出后处理）
#
#   本文件只负责两件事：
#     1. 用 mr 把「烂文件名」洗成「能被正常解析的文件名」→ 减少「识别不到」
#     2. 用 mp 修正 TMDB 与文件不一致的季集号 → 减少「季集错乱」
#
#   ⚠ tmdb_override / tmdb_blacklist 需要具体 TMDB ID，属一次性个案，
#     放在文件末尾以注释形式给出模板，用到时再打开填写。
#
# ------------------------------------------------------------------------------
# 【语法要点（官方文档）】
#   · 正则默认不区分大小写；替换里用 $1 $2 引用捕获组
#   · mr 按定义顺序依次执行，靠前的先生效
#   · 多个 mr 规则叠加时，前一条的输出就是后一条的输入
#   · action: remove 表示整段删除；用 replace 时不要漏写，否则该条不生效
#
# ------------------------------------------------------------------------------
# 【使用方式】
#   1. 「规则引擎 → 自定义规则」页面，把本文件内容粘贴进去（或分段取用）。
#   2. 先只启用 mr 的前 3 条跑一批文件，看识别率变化，再逐条加。
#   3. mp 的 ID 必须换成你实际的 TMDB ID，示例里的数字是占位符。
#
# ------------------------------------------------------------------------------
# 【三条铁律 —— 写 mr 之前必读】
#   1. **不要删年份、分辨率、季集号、[tmdbid-xxx] / {tmdb-xxx}**
#      这些是识别的命根子。本文件的正则都刻意避开了它们。
#   2. **正则宁可窄，不要宽**
#      一条 `\[.*\]` 会把 `[tmdbid-902533]` 一起删掉，导致 100% 识别失败。
#      删除类规则一定要带「特征词」限定（www. / .com / @ / 字幕组 等）。
#   3. **一次只改一类问题**
#      同时加 5 条规则后识别率掉了，你分不清是哪条闯的祸。
# ==============================================================================

# ==============================================================================
# 一、mr 渲染词 —— 识别前清洗文件名
# ==============================================================================
mr:

  # ----------------------------------------------------------------------------
  # 1. 删除带网址/邮箱特征的方括号广告
  #    只删「方括号内出现 www. / http / .com / @ 」的段，普通方括号不动。
  #    [tmdbid-902533] 之类不含这些特征，安全。
  # ----------------------------------------------------------------------------
  - name: 删除方括号站标广告
    pattern: "\\[[^\\]]*(?:www\\.|https?:|\\.com|\\.net|\\.org|@)[^\\]]*\\]"
    action: remove

  # ----------------------------------------------------------------------------
  # 2. 删除带站标特征的无括号广告串
  #    形如 xxx.com 出现在文件名里（常紧跟在一串字母后面）
  # ----------------------------------------------------------------------------
  - name: 删除裸网址
    pattern: "(^|[^a-zA-Z0-9])(?:www\\.)?[a-zA-Z0-9-]{2,30}\\.(?:com|net|org|cc|top|xyz)([^a-zA-Z0-9]|$)"
    replace: "$1$2"

  # ----------------------------------------------------------------------------
  # 3. 中文集数 → 标准 SxxExx 用的 E 标记
  #    「第12集 / 第12话 / 第12話 / 第12期」→ E12
  #    注意：只处理 1~3 位数字，避免误伤「第 2 季」这类
  # ----------------------------------------------------------------------------
  - name: 中文集数转E
    pattern: "第(\\d{1,3})[集话話期]"
    replace: "E$1"

  # ----------------------------------------------------------------------------
  # 4. 中文季号 → Season 标记
  #    「第2季」→ Season 2 ；放在第 3 条之后执行，避免「第2季第3集」被拆错
  # ----------------------------------------------------------------------------
  - name: 中文季号转Season
    pattern: "第(\\d{1,2})季"
    replace: "Season $1"

  # ----------------------------------------------------------------------------
  # 5. 全季包 → 季集范围
  #    「全24集」→ S01E01-E24（首季全集包）；不含季号时才生效
  # ----------------------------------------------------------------------------
  - name: 全季包转范围
    pattern: "全(\\d{1,3})集"
    replace: "S01E01-E$1"

  # ----------------------------------------------------------------------------
  # 6. 竖线分隔符 → 点号
  #    「片名｜2024｜1080p」这类竖线分隔，解析器不认，换成点号
  # ----------------------------------------------------------------------------
  - name: 竖线转点
    pattern: "\\s*[|｜]\\s*"
    replace: "."

  # ----------------------------------------------------------------------------
  # 7. 下划线转点号（仅下划线，不动空格和横杠）
  #    「Movie_Name_2024」→「Movie.Name.2024」
  # ----------------------------------------------------------------------------
  - name: 下划线转点
    pattern: "_"
    replace: "."

  # ----------------------------------------------------------------------------
  # 8. 合并连续点号/空格（清洗过程会造出 .. 或双空格）
  # ----------------------------------------------------------------------------
  - name: 合并连续点号
    pattern: "\\.{2,}"
    replace: "."
  - name: 合并连续空格
    pattern: "\\s{2,}"
    replace: " "

  # ----------------------------------------------------------------------------
  # 9. MahoukaKoukouNoRettousei 系列名降噪（2026-11-10 加入）
  #    根因：[Dbd-Raws][MahoukaKoukouNoRettouseiS1] 里的 "MahoukaKoukouNoRettousei"
  #          是「魔法科高校劣等生」系列名（Rettousei=劣等生），不是本集副标题。
  #          系统拿这个系列名去撞 TMDB 的 4 个 movie 候选，全部 title_conflict。
  #          真正的目标 tv:115312（2021 前传「优等生」）没进候选列表。
  #
  #    处理：把系列名整段删掉，让文件名只剩「季集号 + 压制组 + 编码」，
  #          AI 识别直接认 115312。整理过一次后文件名带 [tmdbid-115312]，
  #          后续零误判。
  #
  #    ⚠ 全部用「消耗式」约束（^|[^A-Za-z0-9] 边界），RE2 安全。
  #    ⚠ 正则默认不区分大小写，所以 Mahouka/mahouka 都覆盖。
  # ----------------------------------------------------------------------------
  - name: 删除MahoukaKoukouNoRettousei系列名
    pattern: "(^|[^a-zA-Z0-9])(?:Mahouka[Kk]oukouNoRettousei|MahoukaKoukouNo[Rr]ettousei|Rettousei|Irregular at Magic High School|The Irregular)[a-zA-Z0-9]*"
    replace: "$1"

  # ----------------------------------------------------------------------------
  # 10. 删除 [Dbd-Raws] 站标（让文件名更干净，识别阶段少一个干扰源）
  # ----------------------------------------------------------------------------
  - name: 删除DbdRaws站标
    pattern: "(^|[^a-zA-Z0-9])\\[Dbd-Raws\\]([^a-zA-Z0-9]|$)"
    replace: "$1$2"

  # ----------------------------------------------------------------------------
  # 11. Mahouka 残词 → 硬绑标题
  #     如果第 9 条没删干净（比如文件名里还残留 "Mahouka" 一个词），
  #     把它替换成官方英文标题 "TheHonorAtMagicHighSchool"，
  #     让 TMDB 候选直接匹配到 tv:115312 的官方标题。
  #     这条放在第 9 条之后，作为兜底。
  # ----------------------------------------------------------------------------
  - name: Mahouka改硬绑标题
    pattern: "(^|[^a-zA-Z0-9])Mahouka([^a-zA-Z0-9]|$)"
    replace: "$1TheHonorAtMagicHighSchool$2"

  # ----------------------------------------------------------------------------
  # 【已撤销】3 位「季集连写」→ SxxExx
  #
  #   曾经写过这样一条（2026-11-17 加、2026-11-18 撤）：
  #     pattern: (^|[^0-9.])([1-9])([0-9]{2})([^0-9]|$)
  #     replace: $1S$2E$3$4
  #   目的是把星蝶公主多语版的「201.mkv」转成「S02E01.mkv」。
  #
  #   为什么撤销：
  #     1) 它把「遮天.2023.S01E190」改成「S01ES1E90」、
  #        「一念永恒.S01E185」改成「S01ES1E85」——
  #        因为「190」前面是字母 E，也被当成合法前缀，于是 E|190 被读成「季1集90」。
  #        凡是集号 ≥100 的长篇（国漫、长篇日番）全部中招，报出荒谬的「第 190 季」。
  #     2) 收紧成「锚定扩展名」版本后确实不再误伤，但它仍然是**全局规则**，
  #        只要文件名形态对上了就会改，跟是哪部剧无关。
  #     3) 星蝶公主那批已经完整入库（4 季 13/22/21/21 集，文件名全是标准 SxxExx），
  #        这条规则已经完成使命，继续留着只剩风险。
  #
  #   【结论】mr 没有「只对某部剧生效」的语法，任何写进来的规则都是全库生效。
  #     ⇒ 像「某部剧的集号形态需要特殊处理」这种个案，**不要写进 mr**。
  #
  #   【正确做法】按代价从低到高：
  #     ① 治本：源目录名里带 [tmdbid-61923]，系统直接采信 ID，不再靠猜标题；
  #     ② 治标：入库前把文件批量改成标准 SxxExx（201.mkv → S02E01.mkv），
  #        用 MediaTidy「文件管理」的重命名，或 115 客户端批量重命名；
  #     ③ 兜底：在整理方案里手动识别该剧。
  #     —— 三种都只影响这一部剧，不会波及全库。
  #
  #   【什么时候才该写进 mr】只有「整库普遍存在、且改了不会破坏其他剧」的清洗才写。
  #     判断标准：拿 20 个真实文件名跑一遍，确认该改的改了、不该改的一个没动。
  # ----------------------------------------------------------------------------

# ==============================================================================
# 二、output_mr —— 命名结果的后处理（作用在最终文件名上）
# ==============================================================================
# ⚠ 这段是「命名规则」的搭档：命名模板本身没有条件分支、去重、判空能力，
#   想省略重复字段只能靠这里的正则。
# ==============================================================================
output_mr:
  # 合并连续空格（属性缺失时可能留出空位）
  - pattern: "\\s{2,}"
    replace: " "
  # 合并连续点号（缺字段时的兜底，正常应该由系统自动合并）
  - pattern: "\\.{2,}"
    replace: "."
  # 去掉扩展名前的多余点号
  - pattern: "\\.\\.(mkv|mp4|ts|iso)$"
    replace: ".$1"

  # ---------------------------------------------------------------------------
  # 清理开头的多余点号
  #    {{title}} 完全取不到值时，文件名会变成「.2004.S01E01.…」
  #    系统只保证合并中间的连续点号，开头的点号要自己清。
  # ---------------------------------------------------------------------------
  - name: 清理开头的多余点号
    pattern: "^\\.+"
    replace: ""

  # ---------------------------------------------------------------------------
  # 【已移除：去掉连续重复字段】
  #    原写法 pattern: "([^.]+)\.\1(?=\.|$)"
  #    ⚠ 用了「反向引用 \1」+「前瞻 (?=」，Go RE2 不支持，会导致整份规则加载失败。
  #    而且当前命名模板已去掉 {{originalTitle}}（只保留 {{title}}），
  #    不会再出现「标题.标题」的重复，这条规则本来也用不上。
  #    若将来命名里加回 {{originalTitle}}，MediaTidy 会自动合并连续重复的
  #    点号与空格，残留的重复标题可手工用更简单的规则处理。
  # ---------------------------------------------------------------------------

# ==============================================================================
# 三、mp 季集映射 —— 修正 TMDB 与实际文件的季集差异
# ==============================================================================
# 【场景 1：文件按「批次」分季，TMDB 合并成单季】← 已启用
#
#   药屋少女的呢喃（tmdb 220542）
#     · TMDB 只有 Season 1，共 60 集（已合并）
#     · 源文件按播出批次编号：S01E01~E24 / S02E01~E24 / S03E01~E24…
#       文件名形如「药屋少女的呢喃.2023 - S03E06 - 第 6 集 - …」
#     · 报错原文：文件识别为第 3 季，但 TMDB 目前只有 1 季
#
#   处理思路：把批次季号抹掉，集号整体平移到 TMDB 的连续编号
#     全局集号 = 24 × (批次 - 1) + 批内集号
#     S02E01 → S01E25，S03E06 → S01E54，依此类推
#
#   ⚠ 当前只保留 S02、S03 两批：TMDB 的 S01 只有 60 集，
#     S03 映射后是 [49,72]，后 12 集（61-72）已超出 TMDB 集数；
#     S04[73,96]、S05[97,120] 则整段越界，已从规则里删掉。
#     等 TMDB 合并出更多集数，或确认实际每批集数不足 24 时，再按实情调整。
#
#   ⚠ 关键：不能只用「只改季号、保持集号」，那样 S02E01 会和 S01E01
#     撞成同一集，后面几批全部重叠。必须整体平移。
#
#   ⚠⚠ 【实测结论】to.ep 只接受 [起, 止] 整数数组，不接受 "EP+24" 这类表达式！
#     写成字符串会报：cannot unmarshal !!str `EP+24` into [2]int
#     所以必须按偏移量手算出目标范围再写死：
#       第 N 批（每批 24 集）→ to.ep: [24×(N-1)+1, 24×N]
#
#   ⚠ 偏移量 24 来自「每批 24 集」这个前提。若实际每批集数不同，
#     请按实际值重算所有 to.ep（并同步改 from.ep 的上界）。
#     核对方法：看该剧 S01 批实际有几个文件，就是每批集数。
#
mp:
  # 药屋少女的呢喃：批次季号 → TMDB 单季的连续集号（每批 24 集）
  - tmdb: 220542
    from: { season: 2, ep: [1, 24] }
    to:   { season: 1, ep: [25, 48] }
  - tmdb: 220542
    from: { season: 3, ep: [1, 24] }
    to:   { season: 1, ep: [49, 72] }
  # S04 / S05 已移除：TMDB 的 S01 只有 60 集，[73,96] 与 [97,120] 全部越界，
  # 映射过去也只会得到「集数不存在」的失败。等 TMDB 真的合并到 96/120 集再加回来。

  # ---------------------------------------------------------------------------
  # 【场景 3：老库按「播出批次」分季，TMDB 已合并成 S1】← 2026-11-18 加入
  #
  #   来源：老库迁移任务 3879（影视库 → 影视中心）的 184 条 season_mismatch。
  #   共同特征：
  #     · 老库按 cour（播出批次）分成 S02/S03/S04，文件名是 S02E01 这种
  #     · TMDB 早已把后续批次并进 S1，连续编号
  #     · 于是报「文件识别为第 N 季，但 TMDB 目前只有 1 季」
  #
  #   修法：把批次季号平移到 S1 连续集号。偏移量 = 前面所有批次的集数之和。
  #     from.ep 写成「整批的理论范围」（宁可写宽），这样以后补集也不用再改规则。
  #
  #   ⚠ 这些偏移量是我按「错误日志里的实际集号 + TMDB 当前总集数」反推的，
  #     总和与 TMDB 对得上才写进来（见每条的核对式）。若 TMDB 后来改了合并方式，
  #     需要按新集数重算。
  # ---------------------------------------------------------------------------

  # Re：从零开始的异世界生活（tmdb 65942）
  #   TMDB：S1 = 85 集（把后续各批全部并进来了）
  #   老库：S01=E1-25 / S02=E1-25 / S03=E1-16 / S04=E1-19
  #   核对式：25 + 25 + 16 + 19 = 85 ✓
  - tmdb: 65942
    from: { season: 2, ep: [1, 25] }
    to:   { season: 1, ep: [26, 50] }
  - tmdb: 65942
    from: { season: 3, ep: [1, 16] }
    to:   { season: 1, ep: [51, 66] }
  - tmdb: 65942
    from: { season: 4, ep: [1, 19] }
    to:   { season: 1, ep: [67, 85] }

  # 一念永恒（tmdb 107371）
  #   TMDB：S1 = 200 集
  #   老库：S01/S02/S03 各 52 集，S04=E1-16（本次失败的就是这 16 集）
  #   核对式：52 × 3 + 16 = 172 ✓（新库 S1 现有 172 个文件，正好对上）
  #   from 上界写 44：157 + 43 = 200，刚好卡在 TMDB 总集数，再多就必然越界
  - tmdb: 107371
    from: { season: 4, ep: [1, 44] }
    to:   { season: 1, ep: [157, 200] }

  # 噗妮露是可爱史莱姆（tmdb 241811）
  #   TMDB：S1 = 24 集（两 cour 合并）
  #   老库：S02 = E1-12
  #   核对式：12 + 12 = 24 ✓
  - tmdb: 241811
    from: { season: 2, ep: [1, 12] }
    to:   { season: 1, ep: [13, 24] }

  # 野生的大魔王出现了！（tmdb 280042）
  #   TMDB：S1 = 24 集；老库 S02 本次报了 E5-E8
  #   核对式：12 + 12 = 24 ✓
  - tmdb: 280042
    from: { season: 2, ep: [1, 12] }
    to:   { season: 1, ep: [13, 24] }

  # 青之箱（tmdb 207347）
  #   TMDB：S1 = 37 集（25 + 12 合并）；老库 S02 本次报了 E5-E6
  #   核对式：25 + 12 = 37 ✓
  - tmdb: 207347
    from: { season: 2, ep: [1, 12] }
    to:   { season: 1, ep: [26, 37] }

  # 冰之城墙（tmdb 283428）
  #   TMDB：S1 = 28 集（14 + 14 合并）；老库 S02 本次报了 E3-E7
  #   核对式：14 + 14 = 28 ✓
  - tmdb: 283428
    from: { season: 2, ep: [1, 14] }
    to:   { season: 1, ep: [15, 28] }

  # ---------------------------------------------------------------------------
  # 【场景 3 里「规则救不了」的，别硬写 mp】—— 写错偏移比不写更糟
  #
  #   ❌ The Cooks（tmdb 4144）：TMDB 只有 13 集，老库 S02 却有 30 集。
  #      集数总量都对不上，说明老库那个目录不是这部剧（认错剧），
  #      或老库是另一个 30 集的版本。→ 人工核对后改目录里的 tmdb ID。
  #
  #   ❌ 誓言无声（tmdb 92472）：TMDB 20 集，老库 S02 有 28 集。
  #      国产剧常见的「20 集版 / 28 集版」差异，TMDB 只收录了 20 集版。
  #      → 要么接受只入库前 20 集，要么手动拆成两季，规则无法两全。
  #
  #   ❌ 普通话（tmdb 287225）：TMDB 只有 1 集，老库 S02 是 E201-E222。
  #      这是「星蝶公主多语版/S02普通话/201.mkv」被认成了《普通话》——
  #      目录里没有 TMDB ID，语言子目录名「普通话」被当成了剧名。
  #      → 在源目录名里补 [tmdbid-61923]，或不要用语言子目录分层。
  #
  #   ❌ 遮天（tmdb 224839）S01E190、一念永恒 S01E185：
  #      报错原文是「识别为第 185 季 / 第 190 季」——
  #      3 位集号被解析器当成了季号（这是程序 bug，不是规则能修的）。
  #
  #   ❌ IT狂人（tmdb 2490）S05E01：TMDB 只有 4 季，第 5 季是最终特辑，
  #      在 TMDB 里归到特别篇。要映射得先知道它是哪个 special，属于个案。
  #
  #   ❌ 暴走恐怖故事（tmdb 240454）S00E01：TMDB 没有 Season 0。
  #
  #   ❌ 黑色五叶草（tmdb 73223）S05E06：TMDB 是 S1=170 + S2=26，
  #      老库按 5 批分季，但查不到每批集数，偏移量算不出来。
  # ---------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# 【场景 2：其余情况的模板】—— 全部注释状态，用到再取消注释
#   改完记得把每行开头的 "# " 去掉。
#
#   模板 A：文件按单季连续编号，TMDB 记成多季（特摄 / 长篇动画常见）
#     文件 S01E25~E48 → 归到 TMDB 的 S02E01~E24
#   # - tmdb: 12345
#     from: { season: 1, ep: [25, 48] }
#     to:   { season: 2, ep: [1, 24] }
#
#   模板 B：全集包按 24 集一季拆分
#   # - tmdb: 67890
#     from: { season: 1, ep: [1, 24] }
#     to:   { season: 1, ep: [1, 24] }
#   # - tmdb: 67890
#     from: { season: 1, ep: [25, 48] }
#     to:   { season: 2, ep: [1, 24] }
#
#   模板 C：整体偏移（文件比 TMDB 少一集片头/特典）
#     文件 E01~E12 → 目标 E02~E13（手算，不要写 "EP+1"）
#   # - tmdb: 11111
#     from: { season: 1, ep: [1, 12] }
#     to:   { season: 1, ep: [2, 13] }
#
#   ⚠ to.ep 只接受 [起, 止] 整数数组：
#     ✅ to: { season: 2, ep: [1, 24] }
#     ❌ to: { season: 2, ep: "EP-24" }   ← 报 cannot unmarshal !!str into [2]int
#     ❌ to: { season: 2, ep: "EP" }
#   需要偏移时自己算好首尾集号再填。
#
# ==============================================================================
# 四、制作组 / 流媒体 标签识别（影响命名里的 {{releaseGroup}} / {{streamingService}}）
# ==============================================================================
# 内置已能识别常见标签。如果命名结果里 releaseGroup 或 streamingService 是空的，
# 再按下面格式补；重复不影响，边界字符会做匹配校验。
#
# groups:
#   - name: "FRDS"
#     keywords: ["FRDS", "Frds"]
#   - name: "WiKi"
#     keywords: ["WiKi", "WIKI"]
#   - name: "CHD"
#     keywords: ["CHD", "CHDBits"]
#   - name: "CMCT"
#     keywords: ["CMCT"]
#   - name: "HDSky"
#     keywords: ["HDSky", "HDS"]
#
# streaming:
#   - name: "Netflix"
#     keywords: ["Netflix", "NF", "NFLX"]
#   - name: "Disney+"
#     keywords: ["DSNP", "Disney+", "DisneyPlus"]
#   - name: "Amazon"
#     keywords: ["AMZN", "Amazon"]
#   - name: "Apple TV+"
#     keywords: ["ATVP", "AppleTV"]
#   - name: "HBO Max"
#     keywords: ["HMAX", "HBOMax", "HBO Max"]

# ==============================================================================
# 五、TMDB 覆盖 / 黑名单 —— 个案修正，按需启用
# ==============================================================================
# 【黑名单：识别到了错误的条目时用】
#   · 匹配键是 tmdb_id + media_type，电影和剧集是独立命名空间，要屏蔽两个得写两条
#   · 被屏蔽的候选会在「同年份唯一性判断 / 评分 / TV 校验 / AI 候选交接」之前过滤，
#     不会阻塞其他可信候选
#   · 屏蔽后若没有其他候选 → 结果是「未识别 + tmdb_blacklisted 诊断」，属预期行为
#   · 不影响手动识别，手动整理仍可用被屏蔽的 ID
#
# tmdb_blacklist:
#   - tmdb_id: 67890
#     media_type: movie
#   - tmdb_id: 67890
#     media_type: tv
#
# 【覆盖：TMDB 元数据本身错了时用】
#   最实用的场景是修正 origin_country —— 它直接决定文件进哪个分类目录，
#   比改分类规则更精准（只影响这一部片）。
#
# tmdb_override:
#   - tmdb_id: 12345
#     media_type: movie
#     title: "正确的中文名"
#     origin_country: ["CN"]

# ==============================================================================
# 【本文件管不到、但同样重要的两件事】
#   1. **未识别目录**：在整理方案「基本设置」里配 unrecognizedDir。
#      不配的话，识别失败的文件会留在原处，且方案记录会报配置错误。
#   2. **文件名里带 TMDB ID 是最高优先级**。
#      命名规则输出的 [tmdbid-xxx] / 现有的 {tmdb-xxx} 会被直接采信，
#      凡是整理过一次的文件，后续再识别都不会出错 —— 误判风险只集中在首次入库。
# ==============================================================================
