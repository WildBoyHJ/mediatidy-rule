# ==============================================================================
# MediaTidy 分类规则  v2（参考 Symedia v2.1.2 的匹配思路重写）
# 目标目录树：category_tree.txt（9 个一级目录 / 139 个目录）
# ------------------------------------------------------------------------------
# 【语法约束】严格按 MediaTidy 文档，未使用 Symedia 的语法：
#   · 顶层只有 movie / tv，键 = 目标相对路径，从上到下匹配，命中即停
#   · 逗号 = OR（中英文逗号均可）；值前缀 "-" = 排除；值前缀 "+" = 必须含（仅 genre_ids）
#   · 字段前缀 "?" = 可选条件（多个可选之间 OR，至少一个通过）
#   · 无条件 = 保底规则（catch-all）
#   · 匹配式：所有必须条件 AND 通过 && （无可选条件 或 至少一个可选通过）
#   · 分类规则不支持正则/通配符
#
# 【从 Symedia 借用的写法】
#   1. R级 用 TMDB include_keywords 的情色标签 + 标题关键词判定，不依赖 content_ratings
#      （国产片在 TMDB 几乎没有分区，靠分级判定会永远落空）
#   2. 纪录片加 "-10402,-16"，排除音乐片/动画片误入
#   3. 演唱会用 "10402,-16" + 演唱会关键词池，再用语种/国家兜底
#   4. 国家判断用「?origin_country OR ?original_language」双可选，比单字段更耐脏数据
#   5. 儿童动画用 "+16,+10762"（两个 genre 必须同时具备）
#   6. 澳门 MO 全量并入华语列表
#   7. 电影、剧集最后都用「欧美」无条件兜底（Symedia 同款策略）
#
# 【未照搬的地方（因为你的目录树不同）】
#   · Symedia 特摄规则带 genre_ids "-16" 排除动画——它的特摄目录按语种分，会把动画抢走；
#     你的树是按系列分（奥特曼/铠甲勇士/布袋戏），且动漫下没有特摄子目录，
#     所以这里不加 -16，让动画版特摄也留在特摄区。
#   · Symedia 的美国分级版 R级 放在文末注释里，需要的话取消注释、删掉情色版即可。
# ==============================================================================

