  # ============================================================================
  # 零、剧集 ISO 不入库（必须排在本段最前，优先于下面所有分类规则）
  # ----------------------------------------------------------------------------
  # 目的：剧集的 .iso 文件不进剧集目录，避免它被质量评分当成「独立版本」保留下来。
  # 原理：分类规则没有「跳过」动作，只能改道 —— 把 iso 统一收到一个不参与
  #       媒体库扫描的目录里，剧集目录就只剩正常视频文件了。
  # 影响：只作用于 tv 段，电影的 .iso 照常进入电影目录，
  #       仍由质量评分规则的 ISO 槽保留（电影 = 1 个 ISO + 1 个非 ISO）。
  # 换目录：把下面的路径改成你自己的即可，注意要同步在 Emby/Jellyfin 里排除扫描。
  # 想「文件完全不动、只是不整理」：分类规则做不到，请用面板里的「媒体封板」。
  # ============================================================================
  _未整理/剧集ISO:
    file_extension: "iso"

