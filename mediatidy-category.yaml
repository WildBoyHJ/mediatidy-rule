# ==============================================================================
# MediaTidy 分类规则（category）v2 —— 按实际媒体库结构重写
# ==============================================================================
#
# 【这个文件是干什么的】
#   决定每个片源整理后进哪个目录。按 TMDB 元数据（类型、语言、国家、关键词、
#   演员导演、分级、年份、文件后缀）匹配，命中第一条规则就停止，
#   直接使用该规则指定的目标路径。
#
#   本文件共 37 条：电影 18 条 + 剧集 19 条。
#
# ------------------------------------------------------------------------------
# 【目录结构（目标路径，相对媒体库根目录）】
#
#   电影（8）
#     电影/华语电影      电影/日本电影      电影/韩国电影    电影/东南亚电影
#     电影/印度电影      电影/欧美电影      电影/其他地区电影  电影/动画电影
#   剧集（6）
#     剧集/国产剧集      剧集/港台剧集      剧集/日本剧集    剧集/韩国剧集
#     剧集/欧美剧集      剧集/其他地区（兜底，承接所有未命中的国家/地区）
#   动漫（3，只放剧集；动画长片统一进 电影/动画电影）
#     动漫/国漫          动漫/日番          动漫/欧美漫
#   其他大类
#     R级/{R级华语电影,R级亚洲电影,R级欧美电影,R级剧集,R级动画电影}
#     特摄剧/{特摄剧电影,特摄剧剧集}
#     综艺/{综艺电影,综艺剧集}
#     儿童/{儿童动画片,儿童剧集}
#     纪录片/{纪录片电影,纪录片剧集}
#     演唱会/{华语歌手演唱会,日韩歌手演唱会,欧美歌手演唱会}
#     _未整理/剧集ISO（剧集 iso 收口，不参与质量评分）
#
# ------------------------------------------------------------------------------
# 【语法：条件怎么写】
#   逗号 = OR               例："zh,cn"（中文或粤语）
#   值前缀 "-" = 排除       例：genre_ids: "-16"（不能是动画）；命中则整条规则失败
#   值前缀 "+" = 必须含     例：genre_ids: "+16,+10762"（两个类型必须同时具备）
#                           注意：+ 前缀只对 genre_ids 有效
#   字段前缀 "?" = 可选条件 例：?origin_country: "JP"；多个可选之间是 OR，
#                           至少一个通过即可
#   字段前缀 "-" 或 "!" = 整条件取反   例：-origin_country: "CN"
#   不写任何条件 = 保底规则，永远命中
#
#   匹配公式：所有必须条件全部通过，且（没有可选条件 或 至少一个可选条件通过）
#
#   可用条件字段（来自 TMDB 元数据 + 文件名解析）：
#     genre_ids            类型 ID：16 动画 / 99 纪录 / 10402 音乐 / 10764 真人秀 …
#     original_language    原始语言：zh / cn / ja / ko / en …
#     origin_country       来源国家地区：CN / TW / HK / MO / JP / KR / US …
#     production_countries 制作国家地区（与来源国家是两个独立字段，不能互相替代）
#     keywords             标题文本包含即匹配
#     include_keywords     TMDB 标签关键词
#     filename_keywords    原始文件名包含即匹配
#     series_actors        演员名包含匹配
#     series_directors     导演名包含匹配
#     content_ratings      地区分级，必须写完整「地区:分级」，如 US:R、JP:R15+
#     vote_average         评分范围，如 "0.1-5.6"
#     year / release_year  年份：精确 "2020" / 范围 "2000-2020" / 开区间 "2020-"
#     file_extension       文件后缀，如 "mkv,iso"
#     resolution           分辨率，如 "2160p,1080p"
#     hdr / dynamic_range  HDR 类型，如 "Dolby Vision,HDR10"
#
# ------------------------------------------------------------------------------
# 【本文件的排列逻辑】
#   电影：特摄剧电影 → 综艺电影 → 演唱会 → 纪录片 → R级(动画→华语→亚洲→欧美)
#         → 电影/动画电影 → 电影（华语/日本/韩国/东南亚/印度/其他地区/欧美兜底）
#   剧集：剧集ISO拦截 → 特摄剧剧集 → 综艺剧集 → 演唱会 → 纪录片 → R级剧集
#         → 儿童 → 动漫 → 剧集（国产/港台/日本/韩国/欧美/其他地区兜底）
#
#   原则是「题材优先，国家兜底」：先判断这是什么类型的片，再判断这是哪国的片。
#
#   为什么演唱会排在纪录片之前：
#     演唱会规则要求「音乐类型 + 标题含演唱会类词」两个条件，已经很窄；
#     而带 99 标签的演唱会实况（如 The Eras Tour）必须先被它接住，
#     否则会被纪录片规则抢走。纯音乐纪录片标题不含这类词，会自然落到纪录片。
#
# ------------------------------------------------------------------------------
# 【使用方式】
#   1. 在「规则引擎 → 分类规则」里导入本文件内容（或整段粘贴到编辑区）。
#   2. 分类规则是**整体替换**：本地一旦存在分类规则，内置规则和订阅规则都不再
#      生效。所以本文件必须作为全量配置使用，不要只贴增量片段。
#   3. 键名就是目标路径，相对媒体库根目录；目录不存在时由整理流程自动创建。
#   4. 分类本身不要求开启元数据提取（ffprobe）；但 resolution、hdr 这类字段
#      在没开时只能靠文件名识别，识别不到就不会命中。
#   5. 建议先拿少量文件试跑，确认落点无误再全库整理。
#
# ------------------------------------------------------------------------------
# 【注意事项（都是实际踩过的坑）】
#   1. 顺序即优先级。从上到下匹配，命中第一条就停，后面的规则不会再执行。
#      所以 R级/R级动画电影 必须排在 电影/动画电影 之前，否则情色动画会被当普通动画。
#   2. 分类规则不支持正则、不支持通配符，只有「包含 / 精确 / 范围」三种匹配。
#   3. 来源国家 ≠ 制作国家。origin_country 取 TMDB 详情顶层字段，部分条目为空，
#      且系统不会用 production_countries 顶替。要按实际制作国分类时，
#      必须显式写 production_countries。
#   4. 排除写法只存在于「值」里（如 original_language: "-zh,-ja"），
#      分类规则整体没有 exclude 段。
#   5. 兜底规则：电影靠「电影/欧美电影」（无条件）、剧集靠「剧集/其他地区」（无条件），
#      保证没有文件落空。删掉它们，未命中的文件会走 MediaTidy 的默认行为。
#      注意剧集侧「欧美剧集」是明确国家/语言列表，不是兜底 —— 未命中的都归「其他地区」。
#   6. 剧集 ISO 拦截规则必须留在 tv 段第一条：它把 .iso 收进 _未整理/剧集ISO，
#      避免剧集 ISO 被质量评分当成独立版本保留。挪位置会直接失效。
#      需要在 Emby/Jellyfin 里排除扫描 `_未整理` 这个目录。
#   7. R级 用「情色标签 + 标题关键词」判定，不用 content_ratings。
#      原因：国产片在 TMDB 上基本没有分级数据，按分级判断会永远落空。
#      代价：暴力/恐怖类 R 级片不会进 R级，仍留在各自的国家目录里。
#   8. 本文件的效果依赖 TMDB 数据质量。TMDB 缺字段时（常见于国产老剧、
#      合拍片、冷门纪录片），对应条件不会命中，文件会落到国家兜底规则。
#   9. 题材类规则（特摄/综艺/演唱会/纪录片/R级）依赖关键字或 TMDB 标签，
#      冷门作品可能识别不到，会落到国家目录 —— 这是可接受的降级，不是错误。
# ==============================================================================

movie:

  # ============================================================================
  # 一、特摄剧电影（必须最前，否则会被动画/日韩电影抢走）
  # ============================================================================
  特摄剧/特摄剧电影:
    ?keywords: "特摄,特攝,奥特曼,超人力霸王,ULTRAMAN,Ultraman,迪迦,赛罗,泰罗,泽塔,特利迦,布莱泽,亚刻,欧布,捷德,艾克斯,银河奥特曼,铠甲勇士,Armor Hero,拿瓦,捕将,刑天,假面骑士,超级战队,牙狼,金甲战士,超神战队,巨神战击队,Power Rangers,超凡战队,恐龙战队,Kamen Rider,Super Sentai,VR Troopers,Beetleborgs,BIMA,神鹰勇士"
    ?include_keywords: "tokusatsu,kaiju,ultraman,super sentai,kamen rider,giant monster"

  # ============================================================================
  # 二、综艺电影（晚会 / 德云社 / 颁奖典礼）
  #   去掉了「综艺」「Variety」这类泛词，避免误吸普通电影
  # ============================================================================
  综艺/综艺电影:
    ?keywords: "春节联欢晚会,春晚,央视春晚,总台春晚,中央广播电视总台,卫视春晚,湖南卫视,东方卫视,江苏卫视,浙江卫视,北京卫视,辽宁卫视,天津卫视,安徽卫视,山东卫视,广东卫视,深圳卫视,湖北卫视,河南卫视,四川卫视,江西卫视,山西卫视,黑龙江卫视,吉林卫视,河北卫视,东南卫视,海峡卫视,凤凰卫视,中秋晚会,秋晚,元宵晚会,元宵节晚会,德云社,颁奖,颁奖典礼,颁奖礼,金鸡奖,百花奖,华表奖,金像奖,金马奖,奥斯卡,Oscar,格莱美,Grammy,艾美奖,Emmy,金球奖,Golden Globe,白玉兰奖,飞天奖,金鹰奖,戛纳,柏林电影节,威尼斯电影节,跨年晚会,联欢晚会"
    ?include_keywords: "awards ceremony,variety special,television special,reality tv"

  # ============================================================================
  # 三、演唱会（标题/标签必须像演唱会才命中；按语种分流，欧美兜底）
  # ============================================================================
  演唱会/华语歌手演唱会:
    genre_ids: "10402,-16"
    keywords: "演唱会,巡演,巡迴,巡回,演出,音乐会,音乐·会,音乐剧,交响乐,奇妙夜,喜乐会,音乐节,音樂節,歌会,现场,現場,Live,Concert,Tour,Performance,Stage,音乐秀,音乐盛宴,摇滚,MV精选集,演奏,歌剧,湾区升明月,升明月,周杰伦,Jay Chou,林俊杰,JJ Lin,王力宏,Leehom Wang,张韶涵,Angela Chang,陈奕迅,Eason Chan,张学友,Jacky Cheung,孙燕姿,Stefanie Sun,李宗盛,Jonathan Lee"
    ?original_language: "zh,cn"
    ?origin_country: "CN,TW,HK,MO"
  演唱会/日韩歌手演唱会:
    genre_ids: "10402,-16"
    keywords: "演唱会,巡演,巡迴,巡回,演出,音乐会,音乐剧,交响乐,奇妙夜,喜乐会,音乐节,音樂節,歌会,现场,現場,Live,Concert,Tour,Performance,Stage,音乐秀,音乐盛宴,摇滚,MV精选集,演奏,歌剧,初音未来,初音ミク,Hatsune Miku,MAGICAL MIRAI,魔法未来,BTS,Bangtan Boys,방탄소년단,BLACKPINK,블랙핑크,TWICE,트와이스,SEVENTEEN,세븐틴,Stray Kids,스트레이 키즈,아이브,IVE WORLD TOUR,IVE THE 1ST WORLD TOUR,IVE FIRST WORLD TOUR,IVE SHOW WHAT I HAVE,NewJeans,뉴진스,aespa,에스파,YOASOBI,ヨアソビ,Ado SPECIAL,Ado WORLD,うっせぇわ,King Gnu,キングヌー,Official髭男dism,髭男,Higedandism,ヒゲダン"
    ?original_language: "ja,ko"
    ?origin_country: "JP,KR"
  演唱会/欧美歌手演唱会:
    genre_ids: "10402,-16"
    keywords: "演唱会,巡演,巡迴,巡回,演出,音乐会,音乐·会,音乐剧,交响乐,奇妙夜,喜乐会,音乐节,音樂節,歌会,现场,現場,Live,Concert,Tour,Performance,Stage,音乐秀,音乐盛宴,摇滚,MV精选集,演奏,歌剧,维也纳新年音乐会,Neujahrskonzert,New Year's Concert,Wiener Philharmoniker,维也纳爱乐,Taylor Swift,Beyoncé,Beyonce,Coldplay,Ed Sheeran,The Weeknd,Harry Styles,Imagine Dragons,Bruno Mars,Lady Gaga"

  # ============================================================================
  # 四、纪录片电影（放演唱会之后：带 99 标签的演唱会实况会先被上面接住）
  #   注意：这里不能加 ?keywords —— 一旦存在可选条件，规则就变成
  #   「必须命中关键词才成立」，普通纪录片会全部漏掉。
  # ============================================================================
  纪录片/纪录片电影:
    genre_ids: "99,-16"

  # ============================================================================
  # 五、R级（情色/限制级：TMDB 情色标签 + 标题关键词判定）
  #     R级动画必须最前，且整段在 电影/动画电影 之前
  # ============================================================================
  R级/R级动画电影:
    genre_ids: "16"
    include_keywords: "eroticism,softcore,sexual fantasy,erotic movie,unusual sexual practices,lesbian sex,gay sex,erotic thriller,erotic drama,erotic horror,erotic animation,hentai,adult animation,ecchi"
  R级/R级华语电影:
    original_language: "zh,cn"
    ?keywords: "聊斋艳谭,肉蒲团,蜜桃成熟时,金瓶梅,三级片,色戒"
    ?include_keywords: "eroticism,softcore,sexual fantasy,erotic movie,unusual sexual practices,lesbian sex,gay sex,erotic thriller,erotic drama,erotic horror,erotic animation"
  R级/R级亚洲电影:
    include_keywords: "eroticism,softcore,sexual fantasy,erotic movie,unusual sexual practices,lesbian sex,gay sex,erotic thriller,erotic drama,erotic horror,erotic animation"
    ?original_language: "ja,ko,th,vi,id,ms,tl,hi,ta,te,ml"
    ?origin_country: "JP,KR,TH,ID,PH,MY,VN,IN,TW"
  R级/R级欧美电影:
    include_keywords: "eroticism,softcore,sexual fantasy,erotic movie,unusual sexual practices,lesbian sex,gay sex,erotic thriller,erotic drama,erotic horror,erotic animation"

  # ============================================================================
  # 六、电影 / 动画电影（所有动画长片统一进这里，不再按国别细分）
  # ============================================================================
  电影/动画电影:
    genre_ids: "16"

  # ============================================================================
  # 七、电影（按国家/地区；欧美为兜底）
  # ============================================================================
  电影/华语电影:
    original_language: "zh,cn"
  电影/日本电影:
    ?origin_country: "JP"
    ?original_language: "ja"
  电影/韩国电影:
    ?origin_country: "KR"
    ?original_language: "ko"
  电影/东南亚电影:
    ?original_language: "id,th,ms,tl,vi,km,lo,my"
    ?origin_country: "TH,SG,MY,PH,ID,VN,KH,LA,MM"
  电影/印度电影:
    keywords: "-战马"
    ?origin_country: "IN,-CN"
    ?original_language: "hi,ta,te,kn,mr,gu,pa,ml,bn"
  # 其他地区：欧洲非英语国、中东、非洲、拉美等
  电影/其他地区电影:
    ?origin_country: "TR,RU,UA,IL,IR,AE,SA,EG,ZA,NG,KE,MA,BR,MX,AR,CL,CO,PE,VE,GR,PL,CZ,HU,RO,BG,HR,RS,SK,SI,EE,LV,LT,IS,PT"
    ?original_language: "tr,ru,uk,ar,fa,he,el,pl,cs,hu,ro,bg,hr,sr,sk,sl,et,lv,lt,is,pt"
  # 电影总兜底
  电影/欧美电影:


tv:

  # ============================================================================
  # 零、剧集 ISO 不入库（必须排在最前，优先于下面所有分类规则）
  # ----------------------------------------------------------------------------
  # 目的：剧集的 .iso 不进剧集目录，避免它被质量评分当成「独立版本」保留。
  # 原理：分类规则没有「跳过」动作，只能改道 —— 把 iso 统一收到一个不参与
  #       媒体库扫描的目录里，剧集目录就只剩正常视频文件了。
  # 影响：只作用于 tv 段，电影的 .iso 照常进入电影目录，
  #       仍由质量评分规则的 ISO 槽保留（电影 = 1 个 ISO + 1 个非 ISO）。
  # 需要在 Emby/Jellyfin 里排除扫描 `_未整理` 这个目录。
  # ============================================================================
  _未整理/剧集ISO:
    file_extension: "iso"

  # ============================================================================
  # 一、特摄剧剧集（奥特曼 / 铠甲勇士 / 布袋戏 / 假面骑士等）
  # ============================================================================
  特摄剧/特摄剧剧集:
    ?keywords: "特摄,特攝,奥特曼,超人力霸王,ULTRAMAN,Ultraman,迪迦,赛罗,泰罗,泽塔,特利迦,布莱泽,亚刻,欧布,捷德,艾克斯,铠甲勇士,Armor Hero,拿瓦,捕将,刑天,布袋戏,霹雳,金光,Pili,Thunderbolt Fantasy,東離劍遊紀,云州大儒侠,苦海女神龙,霹雳神州,霹雳英雄,假面骑士,超级战队,牙狼,金甲战士,超神战队,巨神战击队,Power Rangers,超凡战队,恐龙战队,Kamen Rider,Super Sentai,VR Troopers,Beetleborgs,BIMA,神鹰勇士"
    ?include_keywords: "tokusatsu,kaiju,ultraman,super sentai,kamen rider,puppetry,glove puppetry"

  # ============================================================================
  # 二、综艺剧集（10764 真人秀 / 10767 脱口秀）
  # ============================================================================
  综艺/综艺剧集:
    genre_ids: "10764,10767"

  # ============================================================================
  # 三、演唱会（以剧集形态收录的场次；排除综艺/动画，避免抢走音乐类综艺）
  # ============================================================================
  演唱会/华语歌手演唱会:
    genre_ids: "10402,-16,-10764,-10767"
    keywords: "演唱会,巡演,巡迴,巡回,演出,音乐会,音乐剧,交响乐,音乐节,現場,Live,Concert,Tour,Performance,Stage,音乐现场,湾区升明月,周杰伦,Jay Chou,林俊杰,JJ Lin,王力宏,Leehom Wang,张韶涵,Angela Chang,陈奕迅,Eason Chan,张学友,Jacky Cheung,孙燕姿,Stefanie Sun,李宗盛,Jonathan Lee"
    ?original_language: "zh,cn"
    ?origin_country: "CN,TW,HK,MO"
  演唱会/日韩歌手演唱会:
    genre_ids: "10402,-16,-10764,-10767"
    keywords: "演唱会,巡演,巡迴,巡回,演出,音乐会,音乐剧,交响乐,音乐节,現場,Live,Concert,Tour,Performance,Stage,音乐现场,初音未来,Hatsune Miku,BTS,Bangtan Boys,BLACKPINK,TWICE,SEVENTEEN,Stray Kids,NewJeans,aespa,YOASOBI,Ado SPECIAL,King Gnu,Official髭男dism,ヒゲダン"
