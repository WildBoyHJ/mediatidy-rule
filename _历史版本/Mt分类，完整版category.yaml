    genre_ids: "16"
    ?keywords: "猪猪侠"
    ?series_keywords: "猪猪侠"
  # 必须同时含动画(16)与儿童(10762) → 归儿童动画片
  儿童/儿童动画片:
    genre_ids: "+16,+10762"
  # 儿童剧/亲子真人剧
  儿童/儿童剧集:
    genre_ids: "10762"

  # ============================================================
  # 六、动漫（国漫 / 日番 / 欧美漫）
  # ============================================================
  # 动画 且 非儿童/综艺 且 中港台来源
  动漫/国漫:
    genre_ids: "16,-10762,-10764"
    origin_country: "CN,TW,HK"
  动漫/日番:
    genre_ids: "16"
    origin_country: "JP"
  # 其余动画剧集
  动漫/欧美漫:
    genre_ids: "16"
    origin_country: "-CN,-TW,-HK,-JP"
