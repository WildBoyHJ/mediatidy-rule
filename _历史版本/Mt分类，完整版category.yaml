    ?keywords: "宝宝巴士,BabyBus"
    ?series_keywords: "宝宝巴士,BabyBus"
  儿童/儿童动画片/熊出没系列:
    genre_ids: "16"
    ?keywords: "熊出没"
    ?series_keywords: "熊出没"
