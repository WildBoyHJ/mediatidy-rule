    ?series_keywords: "喜羊羊,灰太狼"
  儿童/儿童动画片/好奇世界系列:
    genre_ids: "16"
    ?keywords: "好奇世界"
    ?series_keywords: "好奇世界"
  儿童/儿童动画片/猫和老鼠系列:
    genre_ids: "16"
    ?keywords: "猫和老鼠,Tom and Jerry"
    ?series_keywords: "猫和老鼠,Tom and Jerry"
  儿童/儿童动画片/蓝猫淘气三千问系列:
    genre_ids: "16"
    ?keywords: "蓝猫淘气,蓝猫三千问,蓝猫"
    ?series_keywords: "蓝猫淘气,蓝猫三千问,蓝猫"
  儿童/儿童动画片/宝宝巴士系列:
