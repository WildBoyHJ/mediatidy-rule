# ==============================================================================
# MediaTidy 分类规则 —— 按目标目录树生成
# 语法要点：
#   1. 从上到下匹配，命中第一条即停 → 特摄/演唱会/综艺/动画等「窄规则」在前，地区规则在后
#   2. 无条件前缀 = 必须(AND)；? 前缀 = 可选(OR)，存在可选条件时「必须全过 AND 可选至少过一个」
#   3. genre_ids: +id 必须含 / -id 必须排除 / 无前缀 参与OR
#   4. series_actors / series_keywords 自动视为可选条件；+ 前缀只用于 genre_ids 的值
#   5. movie 用 production_countries（制作国），tv 用 origin_country（来源国），不要混用
#   6. 电影没有"剧集/综艺"概念；综艺 10764/10767 只对 tv 有意义
# ==============================================================================
movie:

  # ============================================================
  # 一、特摄电影（奥特曼 / 铠甲勇士）——必须排最前，否则会先被动画/日韩抢走
  # ============================================================
  # 标题含 奥特曼 之一 → 归入该系列
  特摄剧/特摄剧电影/奥特曼系列:
    ?keywords: "奥特曼,ULTRAMAN,Ultraman,ultraman,迪迦,赛罗,泰罗,泽塔,特利迦,布莱泽,亚刻"
  # 标题含 铠甲勇士 之一 → 归入该系列
  特摄剧/特摄剧电影/铠甲勇士系列:
    ?keywords: "铠甲勇士,Armor Hero"
  # 其余特摄：标题关键词 或 TMDB 标签任一命中
  特摄剧/特摄剧电影:
    ?keywords: "奥特曼,假面骑士,铠甲勇士,超级战队,哥斯拉,迪迦,赛文,雷欧,艾斯,ultraman,kamen rider,super sentai,tokusatsu,kaiju,godzilla"
    ?include_keywords: "tokusatsu,super sentai,kamen rider,kaiju,giant monster"

  # ============================================================
