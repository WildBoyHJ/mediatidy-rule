  # 分级或标签任一命中。⚠ 若你的库里 TV-MA 剧太多（美剧几乎都是TV-MA），把 §3 里 US:TV-MA 删掉
  R级/R级剧集:
    ?content_ratings: "US:TV-MA,US:NC-17,US:R,KR:18,KR:19,JP:R18+,JP:R15+,TW:18+,HK:III,GB:18,DE:18,FR:18,AU:MA15+,AU:R,CA:18+,NL:16,SE:15"
    ?include_keywords: "x-rated,pornography,extreme horror,erotic"

  # ============================================================
  # 四、纪录片剧集
  # ============================================================
  纪录片/纪录片剧集/华语纪录片:
    genre_ids: "99"
    origin_country: "CN,TW,HK,SG"
  纪录片/纪录片剧集/外语纪录片:
    genre_ids: "99,-16"
  纪录片/纪录片剧集:
    genre_ids: "99"

  # ============================================================
  # 五、儿童剧集
  # ============================================================
  儿童/儿童动画片/喜羊羊系列:
    genre_ids: "16"
